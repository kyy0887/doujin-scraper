name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Verify scripts parse (get-secret & demo)
        run: node --check scripts/get-secret.js && node --check scripts/demo.js

  smoke:
    name: Smoke test (live API doujindesu)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract keys from live site & verify API
        run: npm run get-secret
        env:
          # Tanpa env di sini: script mengekstrak sendiri dari bundle situs.
          # Jalur ini gagal hanya jika situs berubah total (bukan bug kita).
          CI: true
